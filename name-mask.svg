<svg width="700" height="160" viewBox="0 0 700 160" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ASHUTOSH DIXIT</title>

  <defs>
    <clipPath id="textClip">
      <text x="10" y="110" font-family="'Courier New', monospace" font-weight="700" font-size="62" letter-spacing="1">ASHUTOSH DIXIT</text>
    </clipPath>

    <linearGradient id="termGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001a0d"/>
      <stop offset="50%" stop-color="#003318"/>
      <stop offset="100%" stop-color="#001a0d"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ff66" opacity="0.06"/>
    </pattern>

    <mask id="wipeMask">
      <rect x="0" y="0" width="0" height="160" fill="#ffffff">
        <animate attributeName="width" values="0;700" dur="1.4s" begin="0s"
          fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.46 0.45 0.94"/>
      </rect>
    </mask>
  </defs>

  <!-- faint outline visible before the wipe reaches it -->
  <text x="10" y="110" font-family="'Courier New', monospace" font-weight="700" font-size="62"
        letter-spacing="1" fill="none" stroke="#00ff66" stroke-width="0.8" opacity="0.3">
    ASHUTOSH DIXIT
  </text>

  <g clip-path="url(#textClip)" mask="url(#wipeMask)">
    <rect x="0" y="0" width="700" height="160" fill="url(#termGradient)"/>
    <rect x="0" y="0" width="700" height="160" fill="url(#scanlines)"/>
    <text x="10" y="80" font-family="'Courier New', monospace" font-size="11" fill="#00ff66" opacity="0.5">*** WELCOME TO HACKER TERMINAL ***</text>
    <text x="10" y="100" font-family="'Courier New', monospace" font-size="11" fill="#00ff66" opacity="0.5">Type 'start', to start hacking.</text>
    <text x="10" y="120" font-family="'Courier New', monospace" font-size="11" fill="#00ff66" opacity="0.5">Type 'quit' to exit terminal anytime.</text>
    <rect x="0" y="0" width="700" height="160" fill="#00ff66" opacity="0.08"/>
  </g>
</svg>
